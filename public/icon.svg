<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="calBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Base with subtle rounding -->
  <rect width="512" height="512" rx="112" fill="url(#calBg)" />

  <!-- Inner Calendar Card -->
  <g filter="url(#shadow)">
    <rect x="76" y="86" width="360" height="350" rx="36" fill="#ffffff" />
    <!-- Header banner -->
    <path d="M76 122 C76 102.1 92.1 86 112 86 L400 86 C419.9 86 436 102.1 436 122 L436 170 L76 170 Z" fill="url(#headerGrad)" />
    <!-- Binder rings -->
    <rect x="146" y="62" width="28" height="48" rx="14" fill="#1e40af" />
    <rect x="338" y="62" width="28" height="48" rx="14" fill="#1e40af" />
  </g>

  <!-- Date Number '31' or Grid Motif -->
  <!-- Modern Clean Date Number "31" -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="140" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="-4">31</text>
  
  <!-- Mini Accent Dots underneath -->
  <circle cx="216" cy="380" r="10" fill="#3b82f6" />
  <circle cx="256" cy="380" r="10" fill="#10b981" />
  <circle cx="296" cy="380" r="10" fill="#f59e0b" />
</svg>
