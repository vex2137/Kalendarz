    - name: Verify actual AppImage source, complete native libraries and no GGUF/Android binaries
      run: |-
        python3 scripts/check-part4-beta2-appimage.py
        python3 scripts/check-built-native-runtime.py
        xvfb-run -a node tests/linux-desktop-icons.cjs
        CALENDAR_TEST_LLAMA_SERVER="$PWD/build/checked-appimage/squashfs-root/resources/native/cpu/llama-server" node --test tests/native-architectures.test.cjs
        CALENDAR_APPIMAGE_EXECUTABLE="$PWD/release/Kalendarz-1.5.0-Part-4-Beta-2-Linux-x86_64.AppImage" APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node tests/appimage-startup-smoke.cjs
