        npx --no-install electron-builder --win nsis portable --x64 --publish never --config.publish.provider=github --config.publish.owner=vex2137 --config.publish.repo=Kalendarz --config.nsis.artifactName=Kalendarz-1.5.0-Part-4-Beta-2-Windows-x64-Setup.exe --config.portable.artifactName=Kalendarz-1.5.0-Part-4-Beta-2-Windows-x64-Portable.exe
        mkdir -p part4-artifacts/windows
        cp release/*-Setup.exe release/*-Portable.exe part4-artifacts/windows/
        python scripts/check-part4-beta2-windows.py
    - name: Fetch and verify the actual 1.4.2 Portable EXE for the legacy-profile test
      run: |-
        mkdir -p build/source142
        python scripts/release_download.py https://github.com/vex2137/Kalendarz/releases/download/v1.4.2/KALENDARZ-1.4.2-WINDOWS-x86_64.exe build/source142/setup.exe --bytes 124758456 --sha256 b147323b97c62b2ee390af3ee64dd0fa4b983282c2e38b1c3aa367dcb397a1f4
    - name: Real installation, update, uninstall with data retained and portable isolation/move
      run: node tests/windows-packages.cjs
    - name: Use the already-private Qwen v2 only for package acceptance, never packaging
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        mkdir -p "$RUNNER_TEMP/stable-model-test"
        gh api repos/vex2137/Kalendarz-private-builds/releases/assets/679120004 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf"
        python3 - <<'PYMODEL'
        from pathlib import Path
        import hashlib,os
        p=Path(os.environ['RUNNER_TEMP'])/'stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf'
        assert p.stat().st_size==529297056
        with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='fecd8b646db036ca27801f8a4c2d84c5f8baf981ba9a635ea0d2553b652eb1b5'
        print('Private acceptance model size/SHA-256 verified; no weights in package.')
        PYMODEL
    - name: Packaged native CPU inference, streaming, Stop, history and clipboard
      run: |-
        CALENDAR_EXTERNAL_MODEL="$RUNNER_TEMP/stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf" node tests/electron.cjs
        python scripts/part4_beta2_guard.py --source "$CALENDAR_EXPECTED_COMMIT" --check-remote
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Kalendarz-Part-4-Beta-2-windows-${{ inputs.source_commit }}
        path: source/part4-artifacts/windows/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Remove acceptance-only private GGUF
      if: always()
      run: rm -f "$RUNNER_TEMP/stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf"
  flatpak:
    if: github.repository == 'vex2137/Kalendarz-private-builds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: linux
    permissions:
      contents: write
      actions: read
    env:
      CALENDAR_ANDROID_NATIVE: 'false'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Require a private repository and immutable application source
      working-directory: .
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private and (.visibility == "private")')" = true
        python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["CALENDAR_EXPECTED_COMMIT"])'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: vex2137/Kalendarz
        ref: ${{ inputs.source_commit }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Require current application HEAD with accepted Part 2 Stable ancestry
      run: |-
        git merge-base --is-ancestor 5e4ed1718cc40c2c57d44e437fa23ac9cc48d643 "$CALENDAR_EXPECTED_COMMIT"
        python3 scripts/part4_beta2_guard.py --source "$CALENDAR_EXPECTED_COMMIT" --check-remote
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3
    - run: bun install --frozen-lockfile
    - name: Use supported Python for hashlib.file_digest and package checks
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: Kalendarz-Part-4-Beta-2-payload-${{ inputs.source_commit }}
        path: source/part4-artifacts/payload/
    - name: Reuse the exact verified Linux payload; no second native build
      run: |-
        sha256sum -c part4-artifacts/payload/linux-unpacked.tar.sha256
        mkdir -p release
        tar -xf part4-artifacts/payload/linux-unpacked.tar -C release
        python3 - <<'PYINFO'
        import os,sys
        from pathlib import Path
        sys.path.insert(0,'scripts')
        from part4_beta2_guard import verify_candidate_info
        from part2_artifact_guard import asar_build_info
        verify_candidate_info(asar_build_info(Path('release/linux-unpacked/resources/app.asar')),os.environ['CALENDAR_EXPECTED_COMMIT'],False)
        PYINFO
        # The verified tar remains in the private producer artifact. This local copy is no longer needed.
        rm -f -- part4-artifacts/payload/linux-unpacked.tar
        df -h .
    - name: Install Flatpak builder, supported runtime, Electron Zypak base and test tools
      run: |-
        sudo apt-get update -qq
        sudo apt-get install -y flatpak flatpak-builder ostree xvfb xdotool desktop-file-utils dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
    - name: Build/export and install the actual sandboxed candidate before costly bundle compression
      run: |-
        mkdir -p part4-artifacts/flatpak
        flatpak-builder --user --force-clean --repo=build/flatpak-repo --default-branch=beta build/flatpak-root com.vex2137.kalendarz.yml
        flatpak build-update-repo build/flatpak-repo
        flatpak remote-add --user --no-gpg-verify local-candidate "file://$PWD/build/flatpak-repo"
        flatpak install --user -y --noninteractive local-candidate com.vex2137.kalendarz//beta
        python3 scripts/check-part4-beta2-flatpak.py --installed-only
        desktop-file-validate build/flatpak-root/files/share/applications/com.vex2137.kalendarz.desktop
        # Only disposable copies/cache in this ephemeral source checkout. Keep the installed app,
        # build/flatpak-root, export repository, private artifacts and all application data.
        rm -rf -- .flatpak-builder release/linux-unpacked
        df -h .
    - name: Run the installed sandboxed application with actual persistence and filesystem denial
      run: 'xvfb-run -a dbus-run-session -- bash -c ''export XDG_CURRENT_DESKTOP=GNOME; dbus-update-activation-environment DISPLAY XDG_CURRENT_DESKTOP; node tests/flatpak-packaged.cjs'' '
    - name: Use the already-private Qwen v2 only for package acceptance, never packaging
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        mkdir -p "$RUNNER_TEMP/stable-model-test"
        gh api repos/vex2137/Kalendarz-private-builds/releases/assets/679120004 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf"
        python3 - <<'PYMODEL'
        from pathlib import Path
        import hashlib,os
        p=Path(os.environ['RUNNER_TEMP'])/'stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf'
        assert p.stat().st_size==529297056
        with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='fecd8b646db036ca27801f8a4c2d84c5f8baf981ba9a635ea0d2553b652eb1b5'
        print('Private acceptance model size/SHA-256 verified; no weights in package.')
        PYMODEL
    - name: Actual CPU GGUF inference inside the Flatpak sandbox
      run: CALENDAR_EXTERNAL_MODEL="$RUNNER_TEMP/stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf" python3 scripts/flatpak-cpu-smoke.py
    - name: Real local Flatpak update and preserved event; test commit is never uploaded
      run: |-
        mkdir -p build/flatpak-update-repo
        ostree --repo=build/flatpak-update-repo init --mode=archive-z2
        ostree --repo=build/flatpak-update-repo pull-local build/flatpak-repo app/com.vex2137.kalendarz/x86_64/beta
        origin=$(flatpak info --user --show-origin com.vex2137.kalendarz)
        flatpak remote-modify --user --no-gpg-verify --url="file://$PWD/build/flatpak-update-repo" "$origin"
        flatpak build-export --subject='Ephemeral update persistence test; same application bytes' build/flatpak-update-repo build/flatpak-root beta
        flatpak build-update-repo build/flatpak-update-repo
        flatpak update --user -y --noninteractive --no-deps com.vex2137.kalendarz
        CALENDAR_FLATPAK_REOPEN=true xvfb-run -a dbus-run-session -- bash -c 'export XDG_CURRENT_DESKTOP=GNOME; dbus-update-activation-environment DISPLAY XDG_CURRENT_DESKTOP; node tests/flatpak-packaged.cjs'
        python3 scripts/part4_beta2_guard.py --source "$CALENDAR_EXPECTED_COMMIT" --check-remote
    - name: Bundle the original candidate, then install and recheck the actual downloadable bytes
      run: |-
        flatpak build-bundle build/flatpak-repo part4-artifacts/flatpak/Kalendarz-1.5.0-Part-4-Beta-2-Linux-x86_64.flatpak com.vex2137.kalendarz beta --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
        flatpak uninstall --user -y --noninteractive com.vex2137.kalendarz
        flatpak install --user -y --noninteractive --bundle part4-artifacts/flatpak/Kalendarz-1.5.0-Part-4-Beta-2-Linux-x86_64.flatpak
        python3 scripts/check-part4-beta2-flatpak.py
        CALENDAR_FLATPAK_REOPEN=true xvfb-run -a dbus-run-session -- bash -c 'export XDG_CURRENT_DESKTOP=GNOME; dbus-update-activation-environment DISPLAY XDG_CURRENT_DESKTOP; node tests/flatpak-packaged.cjs'
        python3 scripts/part4_beta2_guard.py --source "$CALENDAR_EXPECTED_COMMIT" --check-remote
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Kalendarz-Part-4-Beta-2-flatpak-${{ inputs.source_commit }}
        path: source/part4-artifacts/flatpak/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Remove acceptance-only private GGUF
      if: always()
      run: rm -f "$RUNNER_TEMP/stable-model-test/kalendarz-qwen35-v2-q4_k_m.gguf"
    - name: Preserve sandbox diagnostics after a failed attempt
      if: failure()
      run: |-
        mkdir -p part4-artifacts/flatpak
        flatpak info --user --show-metadata com.vex2137.kalendarz > part4-artifacts/flatpak/installed-metadata.txt || true
        if [ -f build/flatpak-root/metadata ]; then cp build/flatpak-root/metadata part4-artifacts/flatpak/build-metadata.txt; fi
    - if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Kalendarz-Part-4-Beta-2-flatpak-diagnostics-${{ inputs.source_commit }}
        path: source/part4-artifacts/flatpak/
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0
