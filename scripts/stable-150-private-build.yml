        "$GITHUB_REPOSITORY"
    - name: Install Android ARM64 build tools
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
        "cmake;3.31.6"'
    - name: Reuse accepted Android CPU/Vulkan binaries without retraining or native inference rebuild
      run: 'mkdir -p build/accepted-android

        python3 - <<''PYOLD''

        import subprocess,hashlib

        from pathlib import Path

        p=Path(''build/accepted-android/accepted.apk'')

        with p.open(''wb'') as f:subprocess.run([''gh'',''api'',''repos/vex2137/Kalendarz-private-builds/releases/assets/732684398'',''-H'',''Accept:
        application/octet-stream''],stdout=f,check=True)

        with p.open(''rb'') as f:assert hashlib.file_digest(f,''sha256'').hexdigest()==''80038012c11b27557821869ea02ac1df91c23df3c3a266a3fe5c4dadca73ce47''

        PYOLD

        python3 scripts/reuse-stable-android-native.py build/accepted-android/accepted.apk

        python3 scripts/build-android-vulkan-probe.py

        '
    - name: Build the existing model-free frontend and synchronize Capacitor
      run: 'node scripts/prepare-model-free.cjs

        node node_modules/vite/bin/vite.js build --mode production

        npx --no-install cap sync android

        '
    - uses: gradle/actions/setup-gradle@v4
    - name: Android JVM tests and signed, non-debuggable stable update APK
      run: 'set -euo pipefail

        trap ''rm -f "$CALENDAR_KEYSTORE_PATH"'' EXIT

        cd android

        bash ./gradlew :app:testDiagnosticsUnitTest :app:assembleDiagnostics :app:assembleDiagnosticsAndroidTest -PcalendarFinalStable=true
        -PcalendarAndroidTestBuildType=diagnostics --no-daemon --max-workers=2

        '
    - name: Verify stable certificate, identity, version, ARM64 runtimes and APK integrity
      run: 'mkdir -p part4-artifacts/android

        cp android/app/build/outputs/apk/diagnostics/app-diagnostics.apk part4-artifacts/android/Kalendarz-1.5.0-Android-arm64.apk

        python3 scripts/stable_150_guard.py --source "$CALENDAR_EXPECTED_COMMIT" --check-remote --apk part4-artifacts/android/Kalendarz-1.5.0-Android-arm64.apk

        python3 - <<''PYTESTS''

        import json,xml.etree.ElementTree as ET

        from pathlib import Path

        cases=[c for p in Path(''android/app/build/test-results/testDiagnosticsUnitTest'').glob(''*.xml'') for c in ET.parse(p).getroot().iter(''testcase'')];assert
        cases and not any(c.find(''failure'') is not None or c.find(''error'') is not None for c in cases)

        p=Path(''part4-artifacts/android/Kalendarz-1.5.0-Android-arm64.apk.json'');r=json.loads(p.read_text());r.update(androidJvmTests=len(cases),physicalStableInference=''NOT
        TESTED'',deviceInstrumentation=''Compiled, not executed'');p.write_text(json.dumps(r,indent=2)+''\n'');print(''PASS
        Android JVM cases:'',len(cases))

        PYTESTS

        "$ANDROID_HOME/platform-tools/adb" devices -l

        python3 scripts/deliver-stable-150.py android

        '
    - name: Remove signing material even after failure
