apply plugin: 'com.android.application'

def calendarPackage = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def calendarBuildFile = rootProject.file('../dist/build-info.json')
def calendarWebBuild = calendarBuildFile.isFile() ? new groovy.json.JsonSlurper().parse(calendarBuildFile) : [commit: 'unknown']
def calendarVersion = calendarPackage.version.tokenize('.').collect { it as int }
def calendarTestSigning = providers.gradleProperty('calendarTestSigning').orElse('false').get().toBoolean()
def calendarKeystore = System.getenv('CALENDAR_KEYSTORE_PATH')
if (System.getenv('CALENDAR_REQUIRE_RELEASE_SIGNING') == 'true' && !calendarKeystore) {
    throw new GradleException('Stable Android signing is required; configure the CALENDAR_ANDROID_* GitHub secrets.')
}


android {
    testBuildType providers.gradleProperty('calendarAndroidTestBuildType').orElse('debug').get()
    namespace = "com.kalendarz.offline"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kalendarz.offline"
        resValue 'string', 'calendar_build_commit', calendarWebBuild.commit
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode calendarVersion[0] * 10000 + calendarVersion[1] * 100 + calendarVersion[2]
        versionName calendarPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (calendarKeystore) {
            stableRelease {
                storeFile file(calendarKeystore)
                storePassword System.getenv('CALENDAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CALENDAR_KEY_ALIAS')
                keyPassword System.getenv('CALENDAR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        diagnostics {
            initWith debug
            applicationIdSuffix '.diagnostics'
            versionNameSuffix '-diagnostics'
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
        }
        // Opt in only for downloadable test APKs; production signing stays external.
        release {
            if (calendarKeystore) {
                signingConfig signingConfigs.stableRelease
            } else if (calendarTestSigning) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            testProguardFiles 'proguard-test-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


// cap sync must have copied the verified weights before any APK can be assembled.
tasks.register('verifyBundledModel') {
    doLast {
        def model = new groovy.json.JsonSlurper().parse(rootProject.file('../src/utils/localModelManifest.json'))
        def weights = file("src/main/assets/public/models/${model.file}")
        if (!weights.isFile() || weights.length() != model.bytes) throw new GradleException('Bundled model missing: run npm run build and npx cap sync android')
        def hash = java.security.MessageDigest.getInstance('SHA-256')
        weights.withInputStream { stream ->
            byte[] buffer = new byte[1024 * 1024]
            int count
            while ((count = stream.read(buffer)) != -1) hash.update(buffer, 0, count)
        }
        if (hash.digest().encodeHex().toString() != model.sha256) throw new GradleException('Bundled model checksum mismatch')
    }
}
tasks.named('preBuild').configure { dependsOn('verifyBundledModel') }
