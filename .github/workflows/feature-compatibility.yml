name: Android feature compatibility
on:
  push:
    branches: [feature/navigation-themes-encrypted-sync, fix/ai-140-diagnostics]
    paths: ['android/**', 'scripts/test-android.sh', 'scripts/verify-android-tests.py', '.github/workflows/feature-compatibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable test APK
        working-directory: android
        run: bash ./gradlew assembleRelease assembleReleaseAndroidTest -PcalendarTestSigning=true -PcalendarAndroidTestBuildType=release --no-daemon
      - name: Verify existing official Android identity
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/official-1.3.1.apk" https://github.com/vex2137/Kalendarz/releases/download/v1.3.1/Calendar-1.3.1-android.apk
          node scripts/verify-android-signature.cjs "$RUNNER_TEMP/official-1.3.1.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/official-1.3.1.apk" | head -n 1
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test-android.sh
      - name: Verify Android functional test results
        if: always()
        run: python3 scripts/verify-android-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: android/app/build/reports/androidTests/
      - name: Verify APK signature and version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$tools/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | tee /tmp/kalendarz-apk.txt
          grep -F "versionName='$version'" /tmp/kalendarz-apk.txt
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Calendar-${version}-android-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error
