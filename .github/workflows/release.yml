name: Release packages

on:
  push:
    branches: [main, fix/ai-140-diagnostics, feat/ai-141-qwen-native-gpu]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-notes/**'
      - 'package.json'
      - 'scripts/verify-release.cjs'
      - 'scripts/verify-android-tests.py'
      - 'scripts/restore-android-signing.cjs'
      - 'scripts/prepare-model.cjs'
      - 'src/utils/localModelManifest.json'
      - 'android/app/src/androidTest/**'
      - 'android/app/proguard*.pro'
      - 'android/app/build.gradle'
      - 'electron/**'
      - 'src/**'
      - 'scripts/prepare-native.py'
      - 'scripts/native-runtime-manifest.json'
      - 'scripts/test-android-upgrade.sh'
      - 'tests/native-*.cjs'
  workflow_dispatch:
    inputs:
      android_apk_only:
        type: boolean
        default: false
        description: Attach a missing production APK to an existing release; never overwrite an APK
      manual_publish:
        type: boolean
        default: false
        description: Publish checked artifacts with a one-use encrypted signing handoff
      source_commit:
        type: string
        description: Exact tested release source commit
      package_run:
        type: string
        description: Run containing tested web/Windows/Linux/Flatpak artifacts
      android_run:
        type: string
        description: Successful Android compatibility run

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: inputs.manual_publish != true && inputs.android_apk_only != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: npm run check
      - run: npm run test:native
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify language settings, navigation and notification status
        run: |
          node node_modules/vite/bin/vite.js preview --host=127.0.0.1 --port=4176 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4176/
          node tests/language-notifications.cjs
          node tests/mobile-navigation.cjs
          node tests/navigation-themes-sync.cjs
      - name: Package self-hosted web application
        run: |
          mkdir -p release
          version=$(node -p 'require("./package.json").version')
          (cd dist && zip -qr "../release/Calendar-${version}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release/*-web.zip
          if-no-files-found: error

  desktop:
    if: inputs.manual_publish != true && inputs.android_apk_only != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            targets: --linux AppImage
          - os: windows-2025
            platform: windows
            targets: --win nsis portable zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: npm run build
      - name: Stage verified native inference runtimes
        run: python scripts/prepare-native.py
      - name: Real native CPU inference and lifecycle
        run: npm run test:native:model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-inference-${{ matrix.platform }}
          path: native-smoke-results.json
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npx electron-builder ${{ matrix.targets }} --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Test packaged Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          chmod +x "release/Calendar-${version}-linux-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 ELECTRON_EXECUTABLE="$PWD/release/Calendar-${version}-linux-x86_64.AppImage" xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  flatpak:
    if: inputs.manual_publish != true && inputs.android_apk_only != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Install Flatpak build tools and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npm run build:flatpak
      - name: Verify installable bundle
        run: |
          version=$(node -p 'require("./package.json").version')
          flatpak install --user -y --noninteractive "release/Calendar-${version}-linux-x86_64.flatpak"
          flatpak info --user com.vex2137.kalendarz
      - name: Start installed Flatpak and execute bundled model
        env:
          DEBUG: 'pw:browser*'
        run: |
          npx playwright install-deps chromium
          printf '%s\n' '#!/bin/sh' 'exec flatpak run com.vex2137.kalendarz "$@"' > "$RUNNER_TEMP/calendar-flatpak"
          chmod +x "$RUNNER_TEMP/calendar-flatpak"
          ELECTRON_EXECUTABLE="$RUNNER_TEMP/calendar-flatpak" xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: release/*.flatpak
          if-no-files-found: error

  android:
    if: inputs.manual_publish != true && inputs.android_apk_only != true
    runs-on: ubuntu-24.04
    env:
      CALENDAR_REQUIRE_RELEASE_SIGNING: 'true'
      CALENDAR_KEYSTORE_PASSWORD: ${{ secrets.CALENDAR_ANDROID_STORE_PASSWORD }}
      CALENDAR_KEY_ALIAS: ${{ secrets.CALENDAR_ANDROID_KEY_ALIAS }}
      CALENDAR_KEY_PASSWORD: ${{ secrets.CALENDAR_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Restore permanent Android signing key
        env:
          CALENDAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.CALENDAR_ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/restore-android-signing.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable test APK
        working-directory: android
        run: bash ./gradlew assembleRelease assembleReleaseAndroidTest -PcalendarTestSigning=true -PcalendarAndroidTestBuildType=release --no-daemon
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash scripts/test-android-upgrade.sh
            bash scripts/test-android.sh
      - name: Verify Android functional test results
        if: always()
        run: python3 scripts/verify-android-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: |
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/upgrade-*.txt
      - name: Enforce permanent Android signing identity
        run: node scripts/verify-android-signature.cjs android/app/build/outputs/apk/release/app-release.apk
      - name: Verify APK signature and version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$tools/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | tee /tmp/kalendarz-apk.txt
          grep -F "versionName='$version'" /tmp/kalendarz-apk.txt
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Calendar-${version}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error

  candidate-checksums:
    needs: [web, desktop, flatpak, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: node scripts/verify-release.cjs
      - name: Record actual installer sizes and hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          rows=[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()} for p in sorted(Path('release').iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt']
          Path('release/installer-sizes.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-checksums
          path: |
            release/SHA256SUMS.txt
            release/installer-sizes.json

  publish:
    needs: [web, desktop, flatpak, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Check all platforms and generate checksums
        run: node scripts/verify-release.cjs
      - name: Require reviewed hardware acceptance for 1.4.1
        run: node scripts/verify-hardware-acceptance.cjs
      - name: Publish tested release
        uses: softprops/action-gh-release@v2
        with:
          name: Calendar ${{ github.ref_name }} (Android, Windows, Linux, Web)
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release/*.apk
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.flatpak
            release/SHA256SUMS.txt


  manual-publish:
    if: inputs.manual_publish == true && inputs.android_apk_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CALENDAR_RELEASE_COMMIT: ${{ inputs.source_commit }}
      CALENDAR_PACKAGE_RUN: ${{ inputs.package_run }}
      CALENDAR_ANDROID_RUN: ${{ inputs.android_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Check artifact sources and successful platform tests
        run: node scripts/verify-manual-release.cjs
      - name: Receive permanent key through one-use encrypted handoff
        run: node scripts/signing-exchange.cjs receive "$GITHUB_RUN_ID" "$RUNNER_TEMP/calendar-signing" "$CALENDAR_RELEASE_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run }}
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android_run }}
          name: release-android
          path: tested-android
      - name: Sign tested APK with permanent identity and verify packaged weights
        run: node scripts/sign-tested-apk.cjs
      - name: Verify complete package set and checksums
        run: node scripts/verify-release.cjs
      - name: Require reviewed hardware acceptance for 1.4.1
        run: node scripts/verify-hardware-acceptance.cjs
      - name: Publish all verified packages
        run: |
          version=$(node -p 'require("./package.json").version')
          gh release upload "v$version" release/*.apk release/*.exe release/*.zip release/*.AppImage release/*.flatpak release/SHA256SUMS.txt --clobber
          gh release edit "v$version" --draft=false --latest --target "$CALENDAR_RELEASE_COMMIT" --notes-file ".github/release-notes/v$version.md"
      - name: Remove temporary private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/calendar-signing"


  android-apk-only:
    if: inputs.android_apk_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Require reviewed hardware acceptance for 1.4.1
        run: node scripts/verify-hardware-acceptance.cjs
      - run: npm run build
      - run: npx cap sync android
      - name: Receive permanent key through one-use encrypted handoff
        run: node scripts/signing-exchange.cjs receive "$GITHUB_RUN_ID" "$RUNNER_TEMP/calendar-signing" "$GITHUB_SHA"
      - name: Build signed Android APK
        run: node scripts/with-android-signing.cjs "$RUNNER_TEMP/calendar-signing" bash android/gradlew -p android :app:assembleRelease --no-daemon --console=plain --max-workers=2
      - name: Verify signature, version and bundled model
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          node scripts/verify-android-signature.cjs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p'
          python - <<'PYVERIFY'
          import zipfile, hashlib, json
          manifest = json.load(open('src/utils/localModelManifest.json'))
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk') as z:
              with z.open('assets/public/models/' + manifest['file']) as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == manifest['sha256']
              assert 'assets/public/models/LICENSE.txt' in z.namelist()
          PYVERIFY
      - name: Attach only patched APK and its checksum
        run: |
          version=$(node -p 'require("./package.json").version')
          mkdir -p apk-release
          cp android/app/build/outputs/apk/release/app-release.apk "apk-release/Calendar-$version-android.apk"
          (cd apk-release && sha256sum *.apk > "Calendar-$version-android.apk.sha256")
          gh release upload "v$version" apk-release/*.apk apk-release/*.sha256
          python3 scripts/maintain-android-assets.py --refresh-checksums "v$version"
      - name: Remove temporary private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/calendar-signing"
