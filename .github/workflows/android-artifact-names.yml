name: Audit and correct Android artifact names
on:
  push:
    branches: [fix/android-artifact-names]
    paths: ['scripts/maintain-android-assets.py', 'scripts/android-artifact-renames.json', '.github/workflows/android-artifact-names.yml']
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply only the reviewed APK metadata renames and checksum updates
permissions:
  contents: write
concurrency:
  group: android-artifact-names
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install signature verification tools only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Test naming and checksum safety
        run: python3 scripts/test-android-artifact-names.py
      - name: Audit existing binaries and apply reviewed renames
        run: |
          args=()
          if [ '${{ github.event_name }}' = push ] || [ '${{ inputs.apply }}' = true ]; then args+=(--apply); fi
          python3 scripts/maintain-android-assets.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-artifact-naming-audit
          path: |
            artifact-naming-audit/*.json
            artifact-naming-audit/*.txt
            artifact-naming-audit/*.sha256
          if-no-files-found: error
