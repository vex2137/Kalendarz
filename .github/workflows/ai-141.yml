name: AI 1.4.1 candidate validation
on:
  push:
    branches: [feat/ai-141-qwen-native-gpu]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-license:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify original model licensing and pinned quantization
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          def get(url):
              with urllib.request.urlopen(url,timeout=60) as r:return r.read()
          repo='Qwen/Qwen3.5-0.8B'
          meta=json.loads(get('https://huggingface.co/api/models/'+repo))
          assert meta['cardData']['license']=='apache-2.0'
          revision=meta['sha']
          license=get(f'https://huggingface.co/{repo}/resolve/{revision}/LICENSE')
          assert b'Apache License' in license and b'Version 2.0' in license
          print(json.dumps({'repository':repo,'revision':revision,'license':'Apache-2.0','licenseSha256':hashlib.sha256(license).hexdigest(),'noticeFiles':[s['rfilename'] for s in meta['siblings'] if 'NOTICE' in s['rfilename'].upper()]},indent=2))
          PY
