name: Prepare Part 2 manual test artifacts
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Paired candidates, a prebuilt Linux test, or a Linux-only Actions build (never a release)'
        type: choice
        default: pair
        options: [pair, appimage-test, appimage-build, android-beta5, signing-check]
      appimage_beta:
        description: 'Linux-only test package label; application source is the exact workflow checkout'
        type: choice
        default: '2'
        options: ['2', '3', '4', '5']
      artifact_manifest:
        description: 'Required for prebuilt targets: exact source/file hashes. Leave empty for appimage-build.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: calendar-part2-manual-tests
  cancel-in-progress: false
jobs:
  verify-and-upload:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && (inputs.target == 'pair' || inputs.target == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Test provenance and version guards (no build)
        run: python3 -m unittest discover -s tests -p test_part2_artifact_guard.py
      - name: Retrieve and verify existing signed artifacts
        env:
          CALENDAR_ARTIFACT_MANIFEST: ${{ inputs.artifact_manifest }}
        run: python3 scripts/verify-part2-beta2-artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-1.5.0-Part-2-Beta-2-Android-manual-test
          path: manual-test-assets/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-1.5.0-Part-2-Beta-2-Linux-CUDA-manual-test
          path: manual-test-assets/linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-appimage-test:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && inputs.target == 'appimage-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check Linux-only guard and preserve paired guard regressions
        run: |
          python3 -m unittest discover -s tests -p test_part2_appimage.py
          python3 -m unittest discover -s tests -p test_part2_artifact_guard.py
      - name: Retrieve and verify the existing current-head AppImage (no build)
        env:
          CALENDAR_ARTIFACT_MANIFEST: ${{ inputs.artifact_manifest }}
        run: python3 scripts/verify-part2-appimage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-Part-2-Beta-2-AppImage-test-${{ github.sha }}
          path: manual-test-assets/appimage/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-appimage-test:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && inputs.target == 'appimage-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CALENDAR_MODEL_FREE: 'true'
      CALENDAR_ANDROID_NATIVE: 'false'
      CALENDAR_BETA_APK: 'false'
      CALENDAR_PART2_BETA: 'true'
      CALENDAR_EXPECTED_COMMIT: ${{ github.sha }}
      CALENDAR_INCLUDE_CUDA: 'true'
      CALENDAR_TEST_APPIMAGE_BETA: ${{ inputs.appimage_beta || '2' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require current source with the native startup fixes
        run: |
          git merge-base --is-ancestor 388980c5ebd12746ebc19274fbf5f7c12e35e396 "$GITHUB_SHA"
          python3 scripts/part2_artifact_guard.py --source "$GITHUB_SHA" --check-remote
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Targeted native regressions, types and existing artifact guards
        run: |
          npm run lint
          npm run test:native
          python3 -m unittest discover -s tests -p test_part2_appimage.py
          python3 -m unittest discover -s tests -p test_part2_artifact_guard.py
      - name: Install browser/Xvfb runtime dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Native diagnostic UI/export regression
        run: |
          node tests/native-startup-browser.cjs
          node tests/assistant-beta4-browser.cjs
          node tests/assistant-beta5-browser.cjs
      - name: Build the existing model-free frontend and Linux AppImage
        run: |
          test ! -e native/linux-x64/runtime-manifest.json
          node scripts/prepare-model-free.cjs
          node node_modules/vite/bin/vite.js build --mode production
          npx --no-install electron-builder --linux AppImage --x64 --publish never --config.publish.provider=github --config.publish.owner=vex2137 --config.publish.repo=Kalendarz --config.linux.artifactName="Kalendarz-1.5.0-Part-2-Beta-${CALENDAR_TEST_APPIMAGE_BETA}-x86_64.AppImage"
      - name: Verify actual AppImage source, no weights and CPU/CUDA/Vulkan library hashes
        run: python3 scripts/check-built-appimage.py
      - name: Check actual CPU/CUDA/Vulkan versions, dependencies and CPU architecture dispatch
        run: |
          python3 scripts/check-built-native-runtime.py
          CALENDAR_TEST_LLAMA_SERVER="$PWD/build/checked-appimage/squashfs-root/resources/native/cpu/llama-server" node --test tests/native-architectures.test.cjs
      - name: Smoke the actual extracted AppImage under Xvfb
        run: xvfb-run -a node tests/appimage-startup-smoke.cjs
      - name: Final live-head provenance guard
        run: python3 scripts/part2_artifact_guard.py --source "$GITHUB_SHA" --check-remote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-Part-2-Beta-${{ env.CALENDAR_TEST_APPIMAGE_BETA }}-AppImage-Actions-build-${{ github.sha }}
          path: manual-test-assets/appimage/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-android-beta5:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && inputs.target == 'android-beta5'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    env:
      CALENDAR_MODEL_FREE: 'true'
      CALENDAR_ANDROID_NATIVE: 'true'
      CALENDAR_BETA_APK: 'false'
      CALENDAR_EXPECTED_COMMIT: ${{ github.sha }}
      CALENDAR_REQUIRE_RELEASE_SIGNING: 'true'
      EXPECTED_ANDROID_CERTIFICATE: ae055d7e4c95b51890af802776390a8eb6d6a45449cffad47ff447b88b564143
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Require private delivery access before building
        env:
          GH_TOKEN: ${{ secrets.CALENDAR_MODEL_DEPOT_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          test "$(gh api repos/vex2137/Kalendarz-private-builds --jq '.private and (.visibility == "private")')" = true
          python3 scripts/android_beta5_guard.py --source "$GITHUB_SHA" --check-remote
      - name: Acquire and verify the existing update key (secrets or one-use encrypted handoff)
        env:
          CALENDAR_ANDROID_KEYSTORE_BASE64: ${{ secrets.CALENDAR_ANDROID_UPDATE_KEYSTORE_BASE64 }}
          CALENDAR_KEYSTORE_PASSWORD: ${{ secrets.CALENDAR_ANDROID_UPDATE_STORE_PASSWORD }}
          CALENDAR_KEY_ALIAS: ${{ secrets.CALENDAR_ANDROID_UPDATE_KEY_ALIAS }}
          CALENDAR_KEY_PASSWORD: ${{ secrets.CALENDAR_ANDROID_UPDATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android-beta5-signing-exchange.cjs receive "$GITHUB_RUN_ID" "$RUNNER_TEMP" "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Targeted Android and shared assistant regressions
        run: |
          npm run lint
          python3 -m unittest discover -s tests -p test_android_beta5.py
          python3 -m unittest discover -s tests -p test_part2_artifact_guard.py
          npx --no-install playwright install --with-deps chromium
          node tests/assistant-beta4-browser.cjs
          node tests/assistant-beta5-browser.cjs
          node tests/android-beta5-browser.cjs
      - name: Install Android ARM64 build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.31.6"'
      - name: Fresh Android b12189 CPU build, never Linux x86_64 binaries or a stale cache
        run: |
          test ! -e build/android-b12189-cpu
          python3 scripts/build-android-native.py --profile beta5 --jobs 3
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h -l -d build/android-jni/arm64-v8a/libcalendar_llama.so > build/android-runtime-elf.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('build/android-runtime-elf.txt').read_text()
          assert 'AArch64' in text and '/system/bin/linker64' in text
          needed=re.findall(r'Shared library: \[(.*?)\]',text)
          assert needed and set(needed)<= {'libc.so','libm.so','libdl.so','liblog.so','libandroid.so'},needed
          print('Android AArch64 PIE; only Android system dependencies:',needed)
          PY
      - name: Build the existing model-free frontend and synchronize Capacitor
        run: |
          node scripts/prepare-model-free.cjs
          node node_modules/vite/bin/vite.js build --mode production
          npx --no-install cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Android JVM tests, signed update APK and compile device tests
        run: |
          set -euo pipefail
          trap 'rm -f "$CALENDAR_KEYSTORE_PATH"' EXIT
          cd android
          bash ./gradlew :app:testDiagnosticsUnitTest :app:assembleDiagnostics :app:assembleDiagnosticsAndroidTest -PcalendarPart2Beta=true -PcalendarPart2BetaNumber=5 -PcalendarAndroidTestBuildType=diagnostics --no-daemon --max-workers=2
      - name: Verify update signature, source, runtime hash, ABI, ZIP and absence of weights
        run: |
          mkdir private-android
          cp android/app/build/outputs/apk/diagnostics/app-diagnostics.apk private-android/Kalendarz-1.5.0-Part-2-Beta-5-Android-arm64.apk
          python3 scripts/android_beta5_guard.py --source "$GITHUB_SHA" --check-remote --apk private-android/Kalendarz-1.5.0-Part-2-Beta-5-Android-arm64.apk
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          tests=[c for p in Path('android/app/build/test-results/testDiagnosticsUnitTest').glob('*.xml') for c in ET.parse(p).getroot().iter('testcase')]
          assert tests and all(c.find('failure') is None and c.find('error') is None for c in tests)
          p=Path('private-android/Kalendarz-1.5.0-Part-2-Beta-5-Android-arm64.apk.json')
          report=json.loads(p.read_text());report['androidJvmTests']=len(tests);report['physicalInferenceTested']=False;report['deviceInstrumentationExecuted']=False
          p.write_text(json.dumps(report,indent=2)+'\n')
          print('Android JVM tests passed:',len(tests))
          PY
          "$ANDROID_HOME/platform-tools/adb" devices -l
          echo 'No ARM64 device/system image is provided by this runner. Device tests compiled; installation, WebView lifecycle and inference require POCO validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer only to the private depot and request authenticated artifact delivery
        env:
          GH_TOKEN: ${{ secrets.CALENDAR_MODEL_DEPOT_TOKEN }}
        run: python3 scripts/deliver-android-beta5-private.py
      - name: Remove signing material even after failure
        if: always()
        run: rm -f "$RUNNER_TEMP/calendar-release.p12"

  signing-readiness:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && inputs.target == 'signing-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing key identity without building an installer
        env:
          UPDATE_STORE: ${{ secrets.CALENDAR_ANDROID_UPDATE_KEYSTORE_BASE64 }}
          UPDATE_PASSWORD: ${{ secrets.CALENDAR_ANDROID_UPDATE_STORE_PASSWORD }}
          UPDATE_ALIAS: ${{ secrets.CALENDAR_ANDROID_UPDATE_KEY_ALIAS }}
          UPDATE_KEY_PASSWORD: ${{ secrets.CALENDAR_ANDROID_UPDATE_KEY_PASSWORD }}
          STANDARD_STORE: ${{ secrets.CALENDAR_ANDROID_KEYSTORE_BASE64 }}
          STANDARD_PASSWORD: ${{ secrets.CALENDAR_ANDROID_STORE_PASSWORD }}
          STANDARD_ALIAS: ${{ secrets.CALENDAR_ANDROID_KEY_ALIAS }}
          STANDARD_KEY_PASSWORD: ${{ secrets.CALENDAR_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PYKEY'
          import os,subprocess,base64
          from pathlib import Path
          matching=False
          for profile in ['UPDATE','STANDARD']:
            values={key:os.environ.get(profile+'_'+key,'') for key in ['STORE','PASSWORD','ALIAS','KEY_PASSWORD']}
            target=Path(os.environ['RUNNER_TEMP'])/'calendar-existing-update-check.p12'
            try:
              if not all(values[k] for k in ['STORE','PASSWORD','ALIAS']):
                print('::notice title=Android update signing::'+profile+': existing signing profile is not configured');continue
              target.write_bytes(base64.b64decode(values['STORE']));target.chmod(0o600)
              env={**os.environ,'CALENDAR_KEYSTORE_PATH':str(target),'CALENDAR_KEYSTORE_PASSWORD':values['PASSWORD'],'CALENDAR_KEY_ALIAS':values['ALIAS'],'CALENDAR_KEY_PASSWORD':values['KEY_PASSWORD'] or values['PASSWORD'],'EXPECTED_ANDROID_CERTIFICATE':'ae055d7e4c95b51890af802776390a8eb6d6a45449cffad47ff447b88b564143'}
              checked=subprocess.run(['java','.github/scripts/VerifyAndroidSigning.java'],env=env,capture_output=True,text=True)
              valid=checked.returncode==0;matching=matching or valid
              print('::notice title=Android update signing::'+profile+': matching update certificate='+str(valid))
            except Exception:
              print('::notice title=Android update signing::'+profile+': existing signing profile could not be verified')
            finally:
              target.unlink(missing_ok=True)
          if not matching:raise SystemExit('Existing Beta 6 update key is unavailable through the configured signing profiles')
          PYKEY
