name: Publish verified Kalendarz 1.5.0 Part 1 Beta 2
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-calendar-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/release/1.5.0-part1-beta2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify, upload and verify the existing signed beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-part1-beta2.py
