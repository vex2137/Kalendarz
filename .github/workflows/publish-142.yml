name: Publish verified Kalendarz 1.4.2
on:
  workflow_dispatch:
    inputs:
      depot_commit:
        description: Exact private depot commit containing the successful final manifest
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-calendar-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable depot selector
        env:
          DEPOT_COMMIT: ${{ inputs.depot_commit }}
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}",os.environ["DEPOT_COMMIT"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vex2137/Kalendarz-private-builds
          ref: ${{ inputs.depot_commit }}
          path: depot
          token: ${{ secrets.CALENDAR_MODEL_DEPOT_TOKEN }}
      - name: Verify tested source, transport bytes, signature and every draft asset before stable publication
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-v142.py ../depot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Kalendarz-1.4.2-publication-evidence
          path: source/release/evidence.json
          if-no-files-found: warn
          retention-days: 30
