name: Prepare Part 2 Beta 2 manual test artifacts
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Paired candidates or a separate Linux-only manual test (never a release)'
        type: choice
        default: pair
        options: [pair, appimage-test]
      artifact_manifest:
        description: 'JSON: exact source and files with name/size/sha256; pair needs versionCode, Linux-only needs kind=appimage-test'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: calendar-part2-manual-tests
  cancel-in-progress: false
jobs:
  verify-and-upload:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && (inputs.target == 'pair' || inputs.target == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Test provenance and version guards (no build)
        run: python3 -m unittest discover -s tests -p test_part2_artifact_guard.py
      - name: Retrieve and verify existing signed artifacts
        env:
          CALENDAR_ARTIFACT_MANIFEST: ${{ inputs.artifact_manifest }}
        run: python3 scripts/verify-part2-beta2-artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-1.5.0-Part-2-Beta-2-Android-manual-test
          path: manual-test-assets/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-1.5.0-Part-2-Beta-2-Linux-CUDA-manual-test
          path: manual-test-assets/linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-appimage-test:
    if: github.repository == 'vex2137/Kalendarz' && github.ref == 'refs/heads/feat/1.5.0-part2' && inputs.target == 'appimage-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check Linux-only guard and preserve paired guard regressions
        run: |
          python3 -m unittest discover -s tests -p test_part2_appimage.py
          python3 -m unittest discover -s tests -p test_part2_artifact_guard.py
      - name: Retrieve and verify the existing current-head AppImage (no build)
        env:
          CALENDAR_ARTIFACT_MANIFEST: ${{ inputs.artifact_manifest }}
        run: python3 scripts/verify-part2-appimage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kalendarz-Part-2-Beta-2-AppImage-test-${{ github.sha }}
          path: manual-test-assets/appimage/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
