name: Stage approved Kalendarz 1.5.0 packages (no build)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [stable, historical]
        default: stable
        required: true
      asset_links:
        type: string
        description: Short-lived links for the exact approved assets; never log or persist
        required: true
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_PLAN: 
    steps:
      - name: Copy approved bytes via one-file read links and verify upload/download
        run: |
          python - <<'PYCODE'
          import base64,hashlib,json,os,shutil,subprocess,urllib.request,urllib.parse
          from pathlib import Path
          fixed=json.loads(base64.b64decode(os.environ['APPROVED_PLAN']))
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          mode=event['inputs']['mode'];assert mode in ('stable','historical')
          links=json.loads(event['inputs']['asset_links'])
          for url in links.values():
              parsed=urllib.parse.urlsplit(url)
              assert parsed.scheme=='https' and parsed.hostname=='release-assets.githubusercontent.com'
              assert parsed.port in (None,443) and parsed.username is None and parsed.password is None
              assert '\n' not in url and '\r' not in url
              print('::add-mask::'+url,flush=True)
          def gh(*args,**kwargs):return subprocess.run(['gh',*args],check=True,**kwargs)
          for part in fixed['plan'][mode]:
              release=json.loads(gh('api',f"repos/vex2137/Kalendarz/releases/{part['release_id']}",capture_output=True,text=True).stdout)
              assert release['draft'] and release['tag_name']==part['tag'] and release['target_commitish']==part['source']
              existing={a['name']:a for a in release['assets']}
              folder=Path(part['tag']);folder.mkdir()
              for f in part['files']:
                  path=folder/f['name'];url=links[str(f['id'])]
                  try:
                      with urllib.request.urlopen(url,timeout=120) as source,path.open('wb') as output:
                          shutil.copyfileobj(source,output,1024*1024)
                  except Exception as exc:
                      raise RuntimeError(f"Asset fetch failed for {f['name']}: {type(exc).__name__}") from None
                  with path.open('rb') as source: actual=hashlib.file_digest(source,'sha256').hexdigest()
                  assert actual==f['digest'].removeprefix('sha256:') and path.stat().st_size==f['size']
                  if f['name'] in existing:
                      assert existing[f['name']]['digest']==f['digest'] and existing[f['name']]['size']==f['size']
                  else:gh('release','upload',part['tag'],str(path),'--repo','vex2137/Kalendarz')
                  print('Verified original package:',f['name'],flush=True)
              (folder/'SHA256SUMS.txt').write_text(''.join(f"{f['digest'].removeprefix('sha256:')}  {f['name']}\n" for f in part['files']))
              if mode=='stable':
                  (folder/'STABLE-1.5.0-INDEX.json').write_text(json.dumps(fixed['index'],indent=2)+'\n')
                  (folder/'RELEASE-NOTES-1.5.0.md').write_text(release['body'])
              else:(folder/'HISTORICAL-SOURCES.json').write_text(json.dumps(part,indent=2)+'\n')
              for file in folder.iterdir():
                  if file.name in {f['name'] for f in part['files']}:continue
                  gh('release','upload',part['tag'],str(file),'--repo','vex2137/Kalendarz')
              verify=folder/'download-check';verify.mkdir()
              gh('release','download',part['tag'],'--repo','vex2137/Kalendarz','--dir',str(verify))
              for f in part['files']:
                  path=verify/f['name']
                  with path.open('rb') as source: actual=hashlib.file_digest(source,'sha256').hexdigest()
                  assert actual==f['digest'].removeprefix('sha256:') and path.stat().st_size==f['size']
              print('PASS: uploaded packages re-downloaded with original SHA-256:',part['tag'],flush=True)
          PYCODE
