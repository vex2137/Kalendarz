name: Web checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-24.04
    env:
      CALENDAR_MODEL_FREE: 'true'
      CALENDAR_ANDROID_NATIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      # Public PR checks cannot access the private bundled release weights.
      - run: npm run lint && npm test
      - run: python3 -m unittest discover -s tests -p test_release_v142.py
      - run: node scripts/prepare-model-free.cjs
      - run: node node_modules/vite/bin/vite.js build --mode production
      - run: npm run test:native
      - run: npm run ai:data && npm run ai:data:validate
      - name: Use HTTPS Ubuntu archives and bounded APT waits
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-calendar-ci-network >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node tests/gguf-import-browser.cjs
      - run: node tests/diagnostics-actions-browser.cjs
      - run: node tests/model-actions-browser.cjs
      - run: node tests/resumable-transfer-browser.cjs
      - run: node tests/model-state-browser.cjs
      - run: node tests/model-transfer-lifecycle-browser.cjs
      - name: Verify automatic biometric prompting and retry lifecycle
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js --host=127.0.0.1 --port=4179 --strictPort > "$RUNNER_TEMP/biometric-vite.log" 2>&1 &
          calendar_biometric_vite_pid=$!
          trap 'kill "$calendar_biometric_vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:4179/ > /dev/null; then break; fi
            sleep 0.1
          done
          node tests/biometric-part2-browser.cjs
  desktop:
    runs-on: ubuntu-24.04
    env:
      CALENDAR_MODEL_FREE: 'true'
      CALENDAR_ANDROID_NATIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: node scripts/prepare-model-free.cjs
      - run: node node_modules/vite/bin/vite.js build --mode production
      - name: Use the pinned public base model for desktop inference regression
        run: |
          export CALENDAR_EXTERNAL_MODEL="$RUNNER_TEMP/ci-models/Qwen3.5-0.8B.Q4_K_M.gguf"
          npx --no-install tsx scripts/fetch-candidate-model.ts qwen3.5-0.8b-q4-k-m "$CALENDAR_EXTERNAL_MODEL"
          echo "CALENDAR_EXTERNAL_MODEL=$CALENDAR_EXTERNAL_MODEL" >> "$GITHUB_ENV"
      - name: Use HTTPS Ubuntu archives and bounded APT waits
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-calendar-ci-network >/dev/null
      - run: npx playwright install-deps chromium
      - run: npx electron-builder --linux dir --publish never
      - run: xvfb-run -a npm run test:desktop
  android-beta2:
    # One emulator run per branch push; web/desktop retain both existing checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/1.5.0-part2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CALENDAR_MODEL_FREE: 'true'
      CALENDAR_ANDROID_NATIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: Prepare a model-free WebView for native storage/lifecycle regression
        run: |
          node scripts/prepare-model-free.cjs
          node node_modules/vite/bin/vite.js build --mode production
          npx --no-install cap sync android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Run Android JVM tests and compile production bridge instrumentation
        run: bash android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PcalendarModelFreeTests=true --no-daemon --max-workers=2
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android 16 SAF callback, bounded bridge, OPFS and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/gradlew -p android :app:connectedDebugAndroidTest -PcalendarModelFreeTests=true '-Pandroid.testInstrumentationRunnerArguments.class=com.kalendarz.offline.GgufSafImportTest#importNonCatalogueGgufThroughSafAndRetainAfterRestart,com.kalendarz.offline.GgufSafImportTest#nativeBridgeReportsExpiredTokensWithoutPrivatePaths,com.kalendarz.offline.CalendarSmokeTest#safPickerStreamsContentUriAndReleasesAccess,com.kalendarz.offline.ModelTransferServiceTest#transferSurvivesStoppedActivityAndResumesAfterNotificationPause' --no-daemon --max-workers=2
      - name: Require actual execution of the selected native regression tests
        run: python3 scripts/verify-beta2-android-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta2-android-jvm-and-instrumentation-results
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
