name: Publish v1.2.0 downloads

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.2.0.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-calendar-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop superseded package and test runs
        uses: actions/github-script@v7
        with:
          script: |
            for (const status of ['in_progress', 'queued']) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, branch: 'main', status, per_page: 50 });
              for (const run of data.workflow_runs) {
                if (['Release packages', 'Web checks', 'Android release'].includes(run.name)) {
                  await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                }
              }
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm reused packages have identical application sources
        run: |
          test "$(node -p 'require("./package.json").version')" = '1.2.0'
          git diff --exit-code 54e0f1d HEAD -- src electron public package.json bun.lock vite.config.ts index.html
      - name: Download already verified Windows, Linux, Flatpak and web packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: '39160427660'
      - run: bun install --frozen-lockfile
      - name: Build installable Android APK
        run: |
          npm run build
          npx cap sync android
          cd android
          bash ./gradlew assembleRelease -PcalendarTestSigning=true --no-daemon
      - name: Verify APK signature and version
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$tools/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -F "versionName='1.2.0'"
          cp android/app/build/outputs/apk/release/app-release.apk release/Kalendarz-Offline-1.2.0-android-test.apk
      - name: Verify all downloads and generate checksums
        run: node scripts/verify-release.cjs --android-kind=test
      - name: Publish downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          target_commitish: ${{ github.sha }}
          name: Kalendarz Offline v1.2.0 (Android, Windows, Linux, Web)
          body_path: .github/release-notes/v1.2.0.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release/*.apk
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.flatpak
            release/SHA256SUMS.txt
