name: Translate existing release descriptions
on:
  push:
    branches: [maintenance/english-release-descriptions]
    paths: ['.github/workflows/english-release-descriptions.yml']
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Translate metadata of existing releases only
        uses: actions/github-script@v7
        with:
          script: |
            const plans = [{"id":419417492,"tag":"v1.2.2","expected_name":"Kalendarz Offline v1.2.2 (Android, Windows, Linux, Web)","expected_body":"# Calendar 1.2.2\n\n## What's changed\n\n- Added Russian interface translations, month and weekday names, date formatting, and a persistent **Русский** language option.\n- Added basic Russian offline assistant commands for creating, finding and rescheduling events, checking availability and conflicts, and planning multiple sessions. English and Polish remain supported; English remains the default for new installations.\n- The app displays **Calendar**, **Kalendarz**, or **Календарь** according to the selected language. Saved event content is preserved.\n- Removed duplicate view tabs on phones: Year, Month, Week, Day and Schedule appear only in the bottom navigation. Desktop view tabs remain at the top.\n- Simplified the mobile header and separated the app name from the displayed month.\n- Added distinct colors for search, assistant, synchronization, settings and downloads.\n- Prevented a missing native notification permission response from causing the `reading 'display'` startup error. Missing or denied permission never starts notification scheduling.\n- Added regression coverage for Russian commands and settings, mobile navigation, notification permission handling, and the recovery of the scheduling queue.\n\nThe assistant remains a local rule-based system. Review and confirm calendar\nchanges before saving. Complex recurring series must be edited in the event editor;\nundo history is limited to the current app session.\n\n## Downloads\n\n- **Android:** `Kalendarz-Offline-1.2.2-android-test.apk` — installable test APK signed with an Android development key; not a Google Play release.\n- **Windows x64:** setup installer, portable executable and ZIP; no commercial Authenticode signature.\n- **Linux x64:** AppImage and Flatpak (Flathub runtimes required).\n- **Web/PWA:** `Kalendarz-Offline-1.2.2-web.zip` for HTTPS hosting; open online once to enable offline use.\n- **Integrity:** `SHA256SUMS.txt` covers all seven packages.\n\nExport a calendar backup before upgrading. Android cannot update an APK signed\nwith a different key; uninstalling an old app deletes its local data. Notification\ndelivery and camera behavior on physical phones depend on permissions, battery\npolicies, and hardware.\n","name":"Calendar Offline v1.2.2 (Android, Windows, Linux, Web)","assets":[{"id":662115302,"name":"Kalendarz-Offline-1.2.2-android-test.apk","size":2160054,"digest":"sha256:f5d542398541e6c15760970679ccb28ae5b539cf586d2f5857fe76c9c1ad351e"},{"id":662115305,"name":"Kalendarz-Offline-1.2.2-linux-x86_64.AppImage","size":125146130,"digest":"sha256:47484f5e879beb2734ca420ca961d99ab36f0766b9ce2851c1203af2d87efca1"},{"id":662115308,"name":"Kalendarz-Offline-1.2.2-linux-x86_64.flatpak","size":90591512,"digest":"sha256:2c3d4ef91f197018deba9e995d64c0bfe045b750421def40fd5dbcf073a5a40c"},{"id":662115306,"name":"Kalendarz-Offline-1.2.2-web.zip","size":274068,"digest":"sha256:a0189dce64798e1f567880506c01870ed2ae800a9c7e448e78300cdc195b35bd"},{"id":662115303,"name":"Kalendarz-Offline-1.2.2-windows-x64-portable.exe","size":100133640,"digest":"sha256:dd4cfb9f86eaf438bad90ff4147c97fb56944e6ba8367eaec68be157c3ba02d8"},{"id":662115299,"name":"Kalendarz-Offline-1.2.2-windows-x64-setup.exe","size":100279833,"digest":"sha256:6970c3c55d38a91b027b1d9822efc0f46887c27c0f8d21f2f2fa0328937a376b"},{"id":662115300,"name":"Kalendarz-Offline-1.2.2-windows-x64.zip","size":153086880,"digest":"sha256:3ef640ead41ec1e4335324c54ad9d73924b9be2e279c0fe3850051302cca9f05"},{"id":662115298,"name":"SHA256SUMS.txt","size":761,"digest":"sha256:9dcb1ed1d4a1311d3ef0901d6003b8b8324be7b5cd30181aa9fc30e41575efcc"}],"draft":false,"prerelease":false,"target":"706c65cd6b57ba78bff7497f8a8497b129020793"},{"id":419237977,"tag":"v1.2.1","expected_name":"Kalendarz Offline v1.2.1 (Android, Windows, Linux, Web)","expected_body":"# Calendar 1.2.1\n\nThis update expands the offline assistant and makes English the default language\nfor new installations. Existing language choices and calendar data are preserved.\nThe app displays **Calendar** in English and **Kalendarz** in Polish.\n\n## What's new\n\n- Reschedule saved, non-recurring events with a before/after preview and explicit confirmation.\n- Get a proposed replacement time when meetings conflict.\n- Choose preferred planning hours, weekdays, and buffers between events in Settings.\n- Search using common Polish word endings, English plurals, and selected calendar-related equivalents.\n- Plan 2–20 sessions as a complete batch, with one session per available preferred day.\n- Undo the last assistant operation during the current app session, including a batch save.\n- Use assistant commands in English and Polish, with follow-up questions for missing dates or times.\n- Correct an event draft conversationally, such as “actually one hour later”.\n- Request accurate weekend, week, and month summaries and duration-aware free slots.\n\nEvery proposed calendar change requires confirmation. Batch saves are atomic.\nStale previews and undo requests refuse to overwrite subsequent edits.\nRecurring series remain editable in the event editor so their scope and exceptions\nare not changed implicitly. Undo history does not survive an app reload.\nAll assistant processing remains local; no language-model download or cloud account is required.\n\n## Downloads\n\n- **Android:** `Kalendarz-Offline-1.2.1-android-test.apk` — installable test APK signed with an Android development key; not a Google Play release.\n- **Windows x64:** installer (`*-setup.exe`), portable executable (`*-portable.exe`), and ZIP. These files do not have a commercial Authenticode signature.\n- **Linux x64:** AppImage and Flatpak (requires the Flathub runtimes).\n- **Web/PWA:** `Kalendarz-Offline-1.2.1-web.zip` for HTTPS hosting. Open the app online once to enable offline use.\n- **Integrity:** `SHA256SUMS.txt` contains checksums for all seven platform packages.\n\nExport a calendar backup before upgrading. Android cannot update an existing APK\nsigned with a different key; uninstalling the previous app deletes its local data.\nNotification delivery and camera behavior on physical phones still depend on device\npermissions, battery policies, and hardware.\n","name":"Calendar Offline v1.2.1 (Android, Windows, Linux, Web)","assets":[{"id":661620402,"name":"Kalendarz-Offline-1.2.1-android-test.apk","size":2148398,"digest":"sha256:3b7c39c638cae70b8e3e2dc1b96e3483e3b0da860b1cd50700002f8521a6c8c0"},{"id":661620407,"name":"Kalendarz-Offline-1.2.1-linux-x86_64.AppImage","size":125133711,"digest":"sha256:7a1dcee50876d0e9aa26f59f8b490223832563870f1d9f77d2299d46d8930fb6"},{"id":661620408,"name":"Kalendarz-Offline-1.2.1-linux-x86_64.flatpak","size":90591664,"digest":"sha256:5c67cd646763c9be2c95ced45922eeae2141f14583a890c19e1285c6e2f4be21"},{"id":661620404,"name":"Kalendarz-Offline-1.2.1-web.zip","size":262555,"digest":"sha256:49f1a89e5e52846b3605b0997ab2ffe159decb7ec92a5bb4acdfc86768d05baa"},{"id":661620406,"name":"Kalendarz-Offline-1.2.1-windows-x64-portable.exe","size":100125701,"digest":"sha256:5ee487266497ab0184bf1992463ae254df9b1ca31a59c19f6d6193180b83d621"},{"id":661620405,"name":"Kalendarz-Offline-1.2.1-windows-x64-setup.exe","size":100271910,"digest":"sha256:92e3d185bff71d297c037c1dbc1bb4bf77f9771e5fa604ef8f661d4d955c5227"},{"id":661620411,"name":"Kalendarz-Offline-1.2.1-windows-x64.zip","size":153075218,"digest":"sha256:f7bc76105febf244443643d5a2ae7d0d7432a4e36bd17b0360d2c973170d0f16"},{"id":661620412,"name":"SHA256SUMS.txt","size":761,"digest":"sha256:a660f424dcad35c6d5fe782e544a961ee647df9e7022facbfed4cbeb0c35fb8f"}],"draft":false,"prerelease":false,"target":"83b7453c7e1cda4f5e12f06563307a3df70471e4"},{"id":416678778,"tag":"v1.2.0","expected_name":"Kalendarz Offline v1.2.0 (Android, Windows, Linux, Web)","expected_body":"Wspólna wersja **1.2.0** dla Androida, Windowsa, Linuksa i aplikacji webowej.\n\n### Pobieranie\n\n- **Android:** `Kalendarz-Offline-1.2.0-android-test.apk` — instalowalny APK do testów, podpisany kluczem deweloperskim Androida. Nie jest wydaniem Google Play. Inny podpis wcześniejszego APK może wymagać eksportu kopii danych i odinstalowania starej aplikacji przed instalacją.\n- **Windows 64-bit:** `*-windows-x64-setup.exe` (instalator), `*-windows-x64-portable.exe` (wersja przenośna) lub `*-windows-x64.zip` (rozpakuj i uruchom `Kalendarz Offline.exe`). Pliki nie mają komercyjnego podpisu Authenticode.\n- **Linux 64-bit:** `*-linux-x86_64.AppImage` (`chmod +x`, następnie uruchom) lub `*-linux-x86_64.flatpak` (`flatpak install --user ./nazwa-pliku.flatpak`; wymagany Flathub).\n- **Web/PWA:** `*-web.zip` — rozpakuj na serwerze HTTPS. Do działania offline otwórz aplikację pierwszy raz z dostępem do internetu.\n- `SHA256SUMS.txt` zawiera sumy kontrolne wszystkich siedmiu paczek.\n\n### Zmiany\n\n- Szybsze widoki kalendarza i wyszukiwanie, wirtualizowana agenda dla dużych kalendarzy.\n- Zapis w IndexedDB z migracją dotychczasowych danych, atomowymi importami i synchronizacją między kartami.\n- Poprawione daty, strefy czasowe, powtarzające się wydarzenia, nakładanie terminów i import/eksport ICS.\n- Synchronizacja QR w skompresowanych częściach, znaczniki usunięcia i kontrola integralności.\n- Poprawiony PIN, automatyczna blokada, przypomnienia i obsługa błędów zapisu.\n- Czytelniejszy interfejs mobilny, obsługa klawiatury i aktualizacje PWA na żądanie.\n- Mniejsze paczki desktopowe i spójne numery wersji; Android versionCode 10200.\n\n### Weryfikacja\n\nSprawdzone: TypeScript, 27 testów regresyjnych, testy przeglądarkowe, zapis i ponowny odczyt w spakowanej aplikacji Windows i Linux, instalacja paczki Flatpak oraz podpis i wersja APK. Paczki desktopowe i webowe pochodzą z wcześniejszego przebiegu z identycznymi źródłami aplikacji; nie były ponownie budowane.\n\nTest funkcjonalny APK w emulatorze nie został potwierdzony. Instalowalny APK jest udostępniony do testowania na telefonie.\n\nDostarczanie powiadomień i zachowanie aparatu na fizycznym telefonie wymagają testu na urządzeniu. Przed aktualizacją wyeksportuj kopię kalendarza w ustawieniach aplikacji.\n","name":"Calendar Offline v1.2.0 (Android, Windows, Linux, Web)","body":"Unified version **1.2.0** for Android, Windows, Linux, and the web app.\n\n### Downloads\n\n- **Android:** `Kalendarz-Offline-1.2.0-android-test.apk` — an installable test APK signed with an Android development key. This is not a Google Play release. If a previous APK has a different signature, you may need to export a data backup and uninstall the old app before installing this version.\n- **Windows 64-bit:** `*-windows-x64-setup.exe` (installer), `*-windows-x64-portable.exe` (portable version), or `*-windows-x64.zip` (extract and run `Kalendarz Offline.exe`). These files do not have a commercial Authenticode signature.\n- **Linux 64-bit:** `*-linux-x86_64.AppImage` (run `chmod +x`, then launch it) or `*-linux-x86_64.flatpak` (`flatpak install --user ./nazwa-pliku.flatpak`; Flathub is required).\n- **Web/PWA:** `*-web.zip` — extract onto an HTTPS server. To enable offline use, open the app online once.\n- `SHA256SUMS.txt` contains checksums for all seven packages.\n\n### Changes\n\n- Faster calendar views and search, with a virtualized agenda for large calendars.\n- IndexedDB storage with migration of existing data, atomic imports, and synchronization between tabs.\n- Improved handling of dates, time zones, recurring events, scheduling overlaps, and ICS import/export.\n- QR synchronization using compressed chunks, deletion markers, and integrity checks.\n- Improved PIN protection, automatic locking, reminders, and handling of save errors.\n- A clearer mobile interface, keyboard support, and on-demand PWA updates.\n- Smaller desktop packages and consistent version numbers; Android versionCode 10200.\n\n### Verification\n\nVerified: TypeScript, 27 regression tests, browser tests, saving and reloading data in the packaged Windows and Linux apps, Flatpak installation, and the APK signature and version. The desktop and web packages come from an earlier run with identical application sources; they were not rebuilt.\n\nThe functional APK test in an emulator was not confirmed. The installable APK is provided for testing on a phone.\n\nNotification delivery and camera behavior on a physical phone require on-device testing. Before upgrading, export a calendar backup in the app's settings.\n","assets":[{"id":654364517,"name":"Kalendarz-Offline-1.2.0-android-test.apk","size":2143642,"digest":"sha256:3cd63c3748406ce3327ef4e2b772949c2440b35ea3709caad3b901826e7dd2ed"},{"id":654364520,"name":"Kalendarz-Offline-1.2.0-linux-x86_64.AppImage","size":125129658,"digest":"sha256:7cc0418accc984da861d59859db2764d09d54eb68ea8c44dc047cb1627e2039e"},{"id":654364516,"name":"Kalendarz-Offline-1.2.0-linux-x86_64.flatpak","size":90584368,"digest":"sha256:bd8426c74528ff0a7afdf941e01ab1ef53acf98c0d93dc9bdde52feb69e95bba"},{"id":654364512,"name":"Kalendarz-Offline-1.2.0-web.zip","size":257858,"digest":"sha256:c8e4e1c65bfe49f3c231fbc9ab30ff5a619c0c0c664fa40fa0c05a239db181d8"},{"id":654364523,"name":"Kalendarz-Offline-1.2.0-windows-x64-portable.exe","size":100121101,"digest":"sha256:be36e39d41f5b3aab7619a3c8a7fee81e8ad2478c1f31d922bbdcda1e0b9e50e"},{"id":654364515,"name":"Kalendarz-Offline-1.2.0-windows-x64-setup.exe","size":100267299,"digest":"sha256:7af3c6bacc9cdb83a28573f77b27bb1aad5de86ef10a333096612c8f26d79510"},{"id":654364513,"name":"Kalendarz-Offline-1.2.0-windows-x64.zip","size":153070354,"digest":"sha256:1531937520ac696be00b6911be2ce7db809ab6d6d3dd842005ab5b331200f262"},{"id":654364514,"name":"SHA256SUMS.txt","size":761,"digest":"sha256:f1052ebdd97ea78b40ec13555de9166ae70b4874dcca91a86a523bdaf452b031"}],"draft":false,"prerelease":false,"target":"5817fc9e3295ca85b483ab37feafa7ae8346b243"},{"id":402442533,"tag":"v1.1.0","expected_name":"Calendarz Desktop v1.1.0 (Windows & Linux)","expected_body":"Official release of the desktop application for Windows and Linux (Electron).\r\n\r\n### Downloads:\r\n- **Windows (.exe)**: Calendar.Offline.exe\r\n- **Linux (.AppImage)**: Calendar.Offline-1.0.0.AppImage\r\n- **Windows (.zip)**: Calendar.Offline-1.0.0-win.zip","name":"Calendar Offline v1.1.0 (Windows & Linux)","assets":[{"id":607558471,"name":"Kalendarz-Offline-1.0.0-win.zip","size":202780493,"digest":"sha256:b248919c5a3ece3601b47f537ec3a872025e57fa8c266f2aeacbdf912fffe531"},{"id":607557724,"name":"Kalendarz-Offline-1.0.0.AppImage","size":177644825,"digest":"sha256:4d2553d24367ddd8d17a9618a8442760daee8d69f3b6729e0a3657b086deec52"},{"id":607557977,"name":"Kalendarz-Offline.exe","size":245726208,"digest":"sha256:346a08fb2c3599d2386559abc8945a5c9888c8cfd5d9e41757977a855874f77a"}],"draft":false,"prerelease":false,"target":"main"},{"id":397383803,"tag":"v1.0.0","expected_name":" Calendar v1.0.0 – Android APK","expected_body":"# 📅 Kalendarz / Calendar v1.0.0 (Android APK)\r\n\r\nFirst official release of **Calendar Offline** for Android!\r\n\r\nA modern, private, 100% local calendar application inspired by Google Calendar. Zero cloud dependency, no telemetry, no tracking, and no account required.\r\n\r\n---\r\n\r\n### ✨ What's Included in this Version:\r\n- 📱 **Android APK (`Calendar.1.0.apk`)**: Standalone, fully offline mobile app.\r\n- 🌐 **Dynamic Bilingual Support**: Automatically switches app name & UI between **Kalendarz** (Polish 🇵🇱) and **Calendar** (English 🇬🇧).\r\n- 🤖 **Offline Smart Assistant (NLP)**: Create events with natural language, detect schedule conflicts, and find free slots without internet.\r\n- 📲 **P2P QR Code Sync**: Synchronize events directly between PC and phone without passing through external servers.\r\n- 📆 **5 Calendar Views**: Month, Week, Day, Year, and Agenda.\r\n- 🇵🇱 **Polish Public Holidays (2026–2031)**: Built-in calculation of statutory non-working days.\r\n- 🔐 **PIN Lock**: Optional 4-digit security code.\r\n- 🎨 **7 Custom Themes**: OLED Dark, Light, Nord, Emerald, Sunset, Lavender, and Mocha.\r\n- 📦 **.ICS Export & Import**: Compatible with Google Calendar, Outlook, and Thunderbird.\r\n\r\n---\r\n\r\n### 📥 Installation:\r\n1. Download `Calendar.1.0.apk` attached below.\r\n2. Open the file on your Android device and install (allow installation from this source if prompted).\r\n3. Enjoy your 100% private offline calendar!","name":"Calendar Offline v1.0.0 – Android APK","assets":[{"id":591393764,"name":"Calendar.1.0.apk","size":4342804,"digest":"sha256:a88cf33f5f0b5f0bb17b7bd354a99af79c9656251d0e5330bbe948f20b2eb86a"}],"draft":false,"prerelease":false,"target":"main"}];
            for (const p of plans) {
              const {data:r} = await github.rest.repos.getRelease({...context.repo, release_id:p.id});
              if (r.tag_name !== p.tag || r.name !== p.expected_name || r.body !== p.expected_body) {
                throw new Error('Release metadata changed; refusing to overwrite ' + p.tag);
              }
            }
            for (const p of plans) {
              await github.rest.repos.updateRelease({...context.repo, release_id:p.id, name:p.name, ...(p.body === undefined ? {} : {body:p.body})});
              const {data:r} = await github.rest.repos.getRelease({...context.repo, release_id:p.id});
              const assets = r.assets.map(a=>({id:a.id,name:a.name,size:a.size,digest:a.digest}));
              if (r.name !== p.name || r.body !== (p.body ?? p.expected_body) ||
                  r.tag_name !== p.tag || r.draft !== p.draft || r.prerelease !== p.prerelease ||
                  r.target_commitish !== p.target || JSON.stringify(assets) !== JSON.stringify(p.assets)) {
                throw new Error('Verification failed for ' + p.tag);
              }
              core.info('Updated and verified English release metadata: ' + p.tag);
            }
